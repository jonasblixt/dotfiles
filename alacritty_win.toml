# Windows: copy to %APPDATA%\alacritty\alacritty.toml

[env]
TERM = "xterm-256color"
COLORTERM = "truecolor"

[window]
dynamic_title = false

[font]
normal = { family = "Hack", style = "Regular" }
bold = { family = "Hack", style = "Bold" }
italic = { family = "Hack", style = "Italic" }
size = 14.0

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>"

[mouse]
hide_when_typing = false

[cursor]
style = { shape = "Block" }
unfocused_hollow = true

[colors]
draw_bold_text_with_bright_colors = false

# Tomorrow Night Bright
[colors.primary]
background = "#151515"
foreground = "#eaeaea"

[colors.cursor]
text = "#000000"
cursor = "#ffffff"

[colors.normal]
black   = "#000000"
red     = "#d54e53"
green   = "#b9ca4a"
yellow  = "#e6c547"
blue    = "#7aa6da"
magenta = "#c397d8"
cyan    = "#70c0ba"
white   = "#ffffff"

[colors.bright]
black   = "#666666"
red     = "#ff3334"
green   = "#9ec400"
yellow  = "#e7c547"
blue    = "#7aa6da"
magenta = "#b77ee0"
cyan    = "#54ced6"
white   = "#ffffff"

[colors.dim]
black   = "#333333"
red     = "#f2777a"
green   = "#99cc99"
yellow  = "#ffcc66"
blue    = "#6699cc"
magenta = "#cc99cc"
cyan    = "#66cccc"
white   = "#dddddd"

# Alt + letter for symbols that are awkward on a Swedish layout
[[keyboard.bindings]]
key = "Q"
mods = "Alt"
chars = "{"

[[keyboard.bindings]]
key = "W"
mods = "Alt"
chars = "}"

[[keyboard.bindings]]
key = "E"
mods = "Alt"
chars = "["

[[keyboard.bindings]]
key = "R"
mods = "Alt"
chars = "]"

[[keyboard.bindings]]
key = "T"
mods = "Alt"
chars = "@"

[[keyboard.bindings]]
key = "P"
mods = "Alt"
chars = "~"

[[keyboard.bindings]]
key = "Y"
mods = "Alt"
chars = "\\"
