# Only settings that differ from kitty's defaults.
# Run `kitty +runpy 'from kitty.config import *; print(commented_out_default_config())'`
# for the full reference.

font_family Hack NF
font_size   12.0

# ':' added so URLs and host:path select as one word
select_by_word_characters :@-./_~?&=%+#

enable_audio_bell       no
window_alert_on_bell    yes
hide_window_decorations yes
update_check_interval   0
clipboard_control       write-clipboard write-primary

# Gruvbox dark
foreground           #ebdbb2
background           #272727
selection_foreground #655b53
selection_background #ebdbb2
url_color            #d65c0d
cursor               #cccccc
cursor_text_color    #111111

color0  #272727
color8  #928373
color1  #cc231c
color9  #fb4833
color2  #989719
color10 #b8ba25
color3  #d79920
color11 #fabc2e
color4  #448488
color12 #83a597
color5  #b16185
color13 #d3859a
