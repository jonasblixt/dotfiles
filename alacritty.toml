[env]
TERM = "xterm-256color"

[window]
dimensions = { columns = 80, lines = 24 }
padding = { x = 2, y = 2 }

[font]
normal = { family = "Knack Nerd Font" }
size = 16.0

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>"

[mouse]
hide_when_typing = false

[colors]
draw_bold_text_with_bright_colors = true

# Gruvbox dark
[colors.primary]
background = "#282828"
foreground = "#ebdbb2"

[colors.normal]
black   = "#282828"
red     = "#cc241d"
green   = "#98971a"
yellow  = "#d79921"
blue    = "#458588"
magenta = "#b16286"
cyan    = "#689d6a"
white   = "#a89984"

[colors.bright]
black   = "#404040"
red     = "#fb4934"
green   = "#b8bb26"
yellow  = "#fabd2f"
blue    = "#83a598"
magenta = "#d3869b"
cyan    = "#8ec07c"
white   = "#ebdbb2"

# Alt + letter for symbols that are awkward on a Swedish layout
[[keyboard.bindings]]
key = "Q"
mods = "Alt"
chars = "{"

[[keyboard.bindings]]
key = "W"
mods = "Alt"
chars = "}"

[[keyboard.bindings]]
key = "E"
mods = "Alt"
chars = "["

[[keyboard.bindings]]
key = "R"
mods = "Alt"
chars = "]"

[[keyboard.bindings]]
key = "T"
mods = "Alt"
chars = "@"

[[keyboard.bindings]]
key = "U"
mods = "Alt"
chars = "$"

[[keyboard.bindings]]
key = "P"
mods = "Alt"
chars = "~"

[[keyboard.bindings]]
key = "Y"
mods = "Alt"
chars = "\\"

[[keyboard.bindings]]
key = "I"
mods = "Alt"
chars = "|"
